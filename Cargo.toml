[package]
name = "meteor-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
serenity = "0.12.4"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde_json = "1.0"
rand = "0.9.2"
poise = "0.6.1"
serde = { version = "1.0.219", features = ["derive"] }
regex = "1.11.2"
chrono = "0.4.41"
humantime = "2.2.0"
